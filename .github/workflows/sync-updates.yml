name: Sync RocketStore Release Updates

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running release sync'
        required: false
        default: 'Manual trigger'
  # Scheduled trigger can be enabled by uncommenting below:
  # schedule:
  #   - cron: '0 */6 * * *' # Every 6 hours

jobs:
  sync-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Registry (Pre-Sync)
        run: npm run validate:registry

      - name: Run GitHub Releases Sync Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync:updates

      - name: Validate Registry (Post-Sync)
        run: npm run validate:registry

      - name: Commit and Push Updated apps-registry.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep -q "apps-registry.json"; then
            echo "Changes detected in apps-registry.json. Committing..."
            git add apps-registry.json
            git commit -m "chore(registry): auto-update release versions from GitHub Releases [skip ci]"
            git push
          else
            echo "No updates detected in apps-registry.json."
          fi
